[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-mcp"
version = "0.3.1"
description = "Nexus MCP: single-gateway facade over Mnemo, Thrift, Agent Governor, and Agent Router"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Sinisa Seslak" }
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "coding-agents", "gateway", "agentic-workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/seslak/nexus-mcp"
Repository = "https://github.com/seslak/nexus-mcp"
Issues = "https://github.com/seslak/nexus-mcp/issues"

[project.scripts]
nexus-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
